<meta charset="utf-8">

<title>מיטל עוז | פסיכותרפיסטית וקרימינולוגית | תל אביב</title>
<meta name="description" content="מיטל עוז, פסיכותרפיסטית וקרימינולוגית M.A. גישה קיומית-אקזיסטנציאליסטית, בגובה העיניים. ליווי במשברי חיים, חרדה, בדידות, התמכרויות וטראומה. קליניקה במרכז תל אביב ומפגשים בזום.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&family=Heebo:wght@300;400;500;600;700;800&family=Noto+Sans+Hebrew:wght@400;500;600;700;800&family=Alef:wght@400;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          sage:        '#9DAC97',
          'sage-deep': '#7c8d77',
          'sage-soft': '#c4cfbe',
          'sage-mist': '#E8ECDF',
          cta:         '#AF6340',
          'cta-deep':  '#965334',
          peach:       '#C59974',
          'peach-soft':'#e3cdb6',
          'peach-deep':'#C59974',
          cream:       '#FAF5EE',
          'cream-2':   '#F0ECE2',
          card:        '#FFFDF8',
          sand:        '#F0ECE2',
          line:        '#E2D8CB',
          ink:         '#5C4C3A',
          'ink-soft':  '#766350',
          'ink-mute':  '#9c8b78',
          'ink-strong':'#321F10',
        },
        fontFamily: {
          serif:     ['"Frank Ruhl Libre"','serif'],
          sans:      ['Assistant','"Noto Sans Hebrew"','Heebo','sans-serif'],
          assistant: ['Assistant','system-ui','sans-serif'],
          heebo:     ['Heebo','system-ui','sans-serif'],
        },
        boxShadow: {
          'soft':  '0 8px 30px -14px rgba(79,59,49,0.14)',
          'lift':  '0 22px 60px -26px rgba(79,59,49,0.26)',
        }
      }
    }
  }
</script>

<style>
  :root{
    --sage:#9DAC97; --sage-deep:#7c8d77; --sage-soft:#c4cfbe; --sage-mist:#E8ECDF;
    --cta:#AF6340; --cta-deep:#965334;
    --peach:#C59974; --peach-soft:#e3cdb6; --peach-deep:#C59974;
    --cream:#FAF5EE; --cream-2:#F0ECE2; --card:#FFFDF8; --sand:#F0ECE2; --line:#E2D8CB;
    --ink:#5C4C3A; --ink-soft:#766350; --ink-mute:#9c8b78; --ink-strong:#321F10;
  }
  html{background:#FAF5EE;}
  body{font-family:'Assistant','Noto Sans Hebrew','Heebo',system-ui,sans-serif;color:var(--ink);
       font-feature-settings:"kern"; -webkit-font-smoothing:antialiased;
       font-weight:400; line-height:1.75;
       background:var(--cream);}
  h1,h2,h3,h4{font-family:'Assistant','Noto Sans Hebrew','Heebo',sans-serif;color:var(--ink);font-weight:700;letter-spacing:-0.01em;}
  ::selection{background:var(--peach);color:var(--ink);}

  /* Smooth anchor scroll with sticky-nav offset */
  html{scroll-behavior:smooth; scroll-padding-top:96px;}

  /* Large airy heading */
  .display{
    font-family:'Assistant','Noto Sans Hebrew',sans-serif;
    color:var(--ink);
    font-weight:700;
    letter-spacing:-0.015em;
    line-height:1.12;
  }
  .display-lg{
    font-family:'Assistant','Noto Sans Hebrew',sans-serif;
    color:var(--ink);
    font-weight:700;
    letter-spacing:-0.02em;
    line-height:1.14;
  }
  /* Emotional / highlighted word — caramel, slightly heavier italic */
  .accent{ color:var(--cta); font-weight:800; font-style:italic; }

  /* Subtle scroll-driven reveal — fade + soft rise. Always-visible fallback if JS fails. */
  .fade-in{
    opacity:1; transform:none;
    transition: opacity 1.1s cubic-bezier(.22,1,.36,1), transform 1.1s cubic-bezier(.22,1,.36,1);
    will-change: opacity, transform;
  }
  .fade-in.pending{opacity:0; transform:translateY(26px);}
  .fade-in.show{opacity:1; transform:none;}
  @media (prefers-reduced-motion: reduce){
    .fade-in, .fade-in.pending, .fade-in.show{
      opacity:1 !important; transform:none !important; transition:none !important;
    }
  }

  #root{position:relative; z-index:1;}

  /* Form field — soft, light */
  .field{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    font: inherit;
    color:var(--ink);
    width:100%;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .field::placeholder{color:var(--ink-mute);}
  .field:focus{
    outline:none;
    border-color:var(--sage-deep);
    box-shadow:0 0 0 3px rgba(125,143,107,.18);
  }
  .field.invalid{ border-color:#c08a6a; box-shadow:0 0 0 3px rgba(192,138,106,.18);}

  /* Soft rounded pill button */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:9px;
    padding:15px 40px; border-radius:999px; font-weight:600; font-size:16px; letter-spacing:.01em;
    transition: transform .2s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
    white-space:nowrap; cursor:pointer;
  }
  .btn-primary{background:var(--cta); color:#fff; box-shadow:0 12px 28px -12px rgba(185,111,69,.6);}
  .btn-primary:hover{background:var(--cta-deep); transform:translateY(-2px);}
  .btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--sage-deep);}
  .btn-ghost:hover{background:rgba(125,143,107,.10);}
  .btn-light{background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.6); backdrop-filter:blur(4px);}
  .btn-light:hover{background:rgba(255,255,255,.3);}

  /* White rounded card */
  .card{ background:var(--card); border:1px solid var(--line); border-radius:26px; box-shadow:0 8px 30px -16px rgba(79,59,49,.14); }

  /* Sage pill label */
  .pill-label{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--sage-mist); color:var(--sage-deep);
    font-size:13.5px; font-weight:700; letter-spacing:.04em;
    padding:7px 18px; border-radius:999px;
  }

  /* Organic sage blob behind hero image */
  .blob{
    border-radius:42% 58% 57% 43% / 50% 44% 56% 50%;
    animation: blobMorph 16s ease-in-out infinite;
  }
  @keyframes blobMorph{
    0%,100%{border-radius:42% 58% 57% 43% / 50% 44% 56% 50%;}
    50%{border-radius:56% 44% 43% 57% / 44% 56% 44% 56%;}
  }
  .soft-img{ border-radius:34px; overflow:hidden; }

  /* Card hover lift */
  .lift-hover{ transition: transform .3s ease, box-shadow .3s ease; }
  .lift-hover:hover{ transform:translateY(-5px); box-shadow:0 26px 60px -28px rgba(79,59,49,.30); }

  /* Sticky CTA — desktop bar / mobile bubble */
  .cta-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:40;
    background: rgba(250,246,238,.94);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border-top:1px solid rgba(124,153,139,.25);
    box-shadow: 0 -10px 30px -20px rgba(70,80,70,.18);
  }
  .cta-bubble{
    position:fixed; bottom:18px; left:18px; z-index:40;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end;
  }
  .cta-bubble .blob-btn{
    width:58px; height:58px; border-radius:999px;
    display:grid; place-items:center; color:#fff;
    box-shadow: 0 14px 28px -10px rgba(0,0,0,.26), 0 0 0 6px rgba(255,255,255,.4);
    transition: transform .15s ease;
  }
  .cta-bubble .blob-btn:hover{transform:translateY(-2px);}

  /* Nav link underline */
  .nav-link{position:relative;}
  .nav-link::after{
    content:""; position:absolute; right:0; left:0; bottom:-7px; height:1.5px;
    background:currentColor; border-radius:2px;
    transform: scaleX(0); transform-origin: right; transition: transform .25s ease;
  }
  .nav-link:hover::after, .nav-link.active::after{ transform: scaleX(1);}

  /* Eyebrow */
  .eyebrow{display:inline-block;
    font-family:'Assistant',sans-serif; font-size:13px;font-weight:700;
    letter-spacing:.22em; color:var(--sage-deep); text-transform:none;}

  /* Peach accent card */
  .peach-card{ background:var(--peach-soft); }

  /* Minimal quote band — sage background */
  .quote-band{ background:var(--sage-mist); }

  /* hide on small / large */
  @media (min-width: 768px){ .only-mobile{display:none !important;} }
  @media (max-width: 767px){ .only-desktop{display:none !important;} }

  /* hide horizontal scrollbar on thoughts carousel */
  .thoughts-strip::-webkit-scrollbar{display:none;}
  .thoughts-strip{ -ms-overflow-style:none; scrollbar-width:none; }
</style>
